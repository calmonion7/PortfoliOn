# 표준 배포(taebro-infra `bin/deploy`, 계약 v5)가 읽는 compose — prod·dev 겸용 하나.
# compose 프로젝트명(portfolion / portfolion-dev)은 bin/deploy 가 -p 로 정하므로 name·container_name·image 를
# 적지 않는다(이미지는 <compose 프로젝트>-<service> — :prev 롤백이 이 이름을 쓴다).
# 기동은 실행 자리 ~/runtime/portfolion/<env>/ 에서 한다 — 거기엔 이 파일과 .env(비밀 정본)만 있다.
#
# prod postgres 는 여기 없다(ADR 261011-074335 결정 1). ⑥-2(task#388)부터 DB 는 taebro-infra 공용 postgres 의 발급 DB
# (prod `portfolion` · dev `portfolion_dev`, 호스트 taebro-postgres:5432) — backend 가 외부 네트워크 taebro-db 에 붙는다.
# 옛 portfolion-postgres-1(볼륨 portfolion_pgdata)과 그 정의 파일은 2026-10-16 지웠다 — 이전 뒤 쓰기 0 을 행 수 대조로 확인한 뒤.
services:
  backend:
    build: ./backend
    env_file:
      # 빌드는 .env 가 없는 러너 체크아웃에서, 기동은 실행 자리에서(.env 필수 — bin/deploy 가 확인)
      - path: .env
        required: false
    mem_limit: 1g      # 1주 관측 최대×2 원칙 — 실측 최대 452.9MB(표본 112개 ≈ 18시간), 1주 뒤 bin/mem-report 로 재조정
    environment:
      # DB = 공용 postgres 발급 DB. 값은 실행 자리 .env 의 PORTFOLION_DATABASE_URL(= taebro-infra 발급 파일 내용)이고,
      # backend 는 DATABASE_URL 을 읽는다. 실행 자리 .env 의 옛 DATABASE_URL 키(옛 컨테이너 주소)는 2026-10-16 지웠다.
      # 변수 이름을 하나로 합치는 건 별도 작업 — 직전 이미지 롤백이 이 이름으로 받는다. 별칭 `postgres` 는 taebro-db 에서 모호하다.
      # 기본값 빈 문자열(계약 v7 — 러너 빌드엔 .env 가 없어 `:?` 금지). eval: backend/tests/test_compose_dev_network.py
      DATABASE_URL: ${PORTFOLION_DATABASE_URL:-}
    networks: [default, taebro-db]
    restart: unless-stopped

  nginx:
    # 프론트 dist 와 nginx.conf 를 이미지에 굽는다 — 롤백은 이미지만 되돌리므로 마운트한 정적 파일은 되돌아가지 않는다.
    build:
      context: .
      dockerfile: nginx/Dockerfile
    # 게시는 루프백 전용 — 공개 경로는 Cloudflare 터널뿐이다(cloudflared → http://localhost:80).
    # 이 좁힘이 ADR 260823-085145 의 「공개 경로는 Cloudflare 전용」 전제를 배포 구성으로 강제해
    # CF-Connecting-IP 위조에 의한 레이트리밋 우회·표적 잠금(B82)을 닫는다.
    # TLS 는 Cloudflare 가 종단한다 — 443 게시·인증서 갱신 컨테이너는 없다(task#384).
    # 호스트 포트는 bin/deploy 가 계약 2절 표에서 주입한다(prod 80 · dev 8084). 하드코딩 금지.
    ports:
      - "127.0.0.1:${TAEBRO_HTTP_PORT}:80"
    depends_on:
      - backend
    mem_limit: 64m     # 실측 최대 3.6MB — 계약의 최소값 64MB
    restart: unless-stopped

networks:
  taebro-db:
    external: true
