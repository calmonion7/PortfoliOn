<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PortfoliOn</title>
    <meta name="theme-color" content="#f6f1e7" />
    <!-- 첫 페인트 전 테마 부트스트랩(task#286) — 저장된 테마가 dark면 번들 CSS·React가 뜨기
         전에 <html>을 이미 다크로 칠한다(themeBoot.js와 바이트 동일해야 함, 테스트가 지킴).
         인라인 배경 규칙이 핵심이다 — data-theme만 세우고 배경을 안 칠하면 번들 CSS 로드
         전까지 브라우저 기본 흰색이라 플래시가 그대로 남는다. 폰트 <link rel="stylesheet">보다
         반드시 앞에 둔다 — 동기 스크립트는 자기보다 앞선 미완료 스타일시트가 있으면 그것이
         로드될 때까지 실행이 차단되는데, 그 링크들은 외부 CDN이라 지연이 크다. -->
    <style>html{background:#f6f1e7}html[data-theme="dark"]{background:#171310}</style>
    <script>
<!-- theme-boot:start -->
try{if(localStorage.getItem('theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');var m=document.querySelector('meta[name=theme-color]');if(m){m.setAttribute('content','#171310')}}}catch(e){}
<!-- theme-boot:end -->
    </script>
    <!-- OAuth 이탈~복귀 스플래시(task#285) — 번들 CSS가 로드되기 전에 떠야 하므로 여기 한 벌만
         두고 LoginPage(oauthSplash.js)도 같은 클래스를 재사용한다. 다크 분기는 위 테마
         부트스트랩이 세우는 [data-theme="dark"]를 따른다(task#286) — prefers-color-scheme는
         쓰지 않는다: 이 앱은 시스템 선호를 따라가지 않고 localStorage.theme만 신호로 삼는다
         (그렇지 않으면 스플래시와 앱이 서로 다른 테마로 뜰 수 있었다, task#285 후속 3). -->
    <style>
      #oauth-splash[hidden] { display: none; }
      .oauth-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        background: #f6f1e7; color: #201b13;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }
      .oauth-splash__mark { width: 40px; height: 40px; }
      .oauth-splash__spinner {
        width: 24px; height: 24px; border-radius: 50%;
        border: 3px solid #1d5f58; border-top-color: transparent;
        animation: oauth-splash-spin 0.6s linear infinite;
      }
      .oauth-splash__text { margin: 0; font-size: 14px; }
      @keyframes oauth-splash-spin { to { transform: rotate(360deg); } }
      [data-theme="dark"] .oauth-splash { background: #171310; color: #ece4d4; }
      [data-theme="dark"] .oauth-splash__spinner { border-color: #62b3a4; border-top-color: transparent; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
  </head>
  <body>
    <div id="root"><div id="oauth-splash" hidden>
<!-- oauth-splash:start -->
<div class="oauth-splash"><img src="/favicon.svg" class="oauth-splash__mark" alt="" /><div class="oauth-splash__spinner" aria-hidden="true"></div><p class="oauth-splash__text">로그인 중…</p></div>
<!-- oauth-splash:end -->
    </div></div>
    <!-- 콜백 착지(/?oauth= 또는 ?error=)에서만 스플래시를 드러낸다 — 일반 로드에는 절대 안 뜬다.
         React가 마운트하며 #root를 통째로 비우므로 제거 코드는 불필요하다. -->
    <script>if(/[?&](oauth|error)=/.test(location.search)){document.getElementById('oauth-splash').hidden=false}</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
