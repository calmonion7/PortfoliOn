# prod postgres 정의 보존본 — 배포 경로가 쓰지 않는다(ADR 261011-074335 결정 1). ⑥-2(공용 taebro-postgres 이전)에서 없어진다.
#
# 표준 배포(bin/deploy)는 매 배포 up --force-recreate 라, postgres 를 docker-compose.yml 에 두면 배포마다
# 유일한 prod DB 컨테이너가 재생성된다. 그래서 지금 컨테이너 portfolion-postgres-1(볼륨 portfolion_pgdata)은
# 손대지 않고 두고, 이 파일은 사람이 컨테이너를 **수동으로** 다시 만들어야 할 때만 쓴다.
#
# 사용법(레포 루트에서):
#   docker compose -p portfolion --env-file .env -f deploy/legacy-postgres.compose.yml up -d postgres
# ⚠️ -p portfolion 필수 — 빠지면 compose 프로젝트명이 이 파일의 디렉터리 이름(deploy)이 되어 볼륨이 deploy_pgdata 로
#    갈라지고 빈 DB 가 뜬다. 네트워크도 portfolion_default 여야 backend 가 별칭 postgres 로 찾는다.
# ⚠️ --env-file .env 필수 — compose 는 .env 를 이 파일의 디렉터리(deploy/)에서 찾는다. 루트 .env 의 POSTGRES_PASSWORD 가 필요하다.
# 상대경로는 이 파일 위치 기준이다(../backend). initdb 스크립트는 빈 볼륨일 때만 돈다.
# 서비스 정의는 옛 docker-compose.yml 의 postgres 와 같게 둔다 — 달라지면 돌고 있는 컨테이너에 up 할 때 재생성된다.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolion
      POSTGRES_USER: portfolion
      # 폴백 금지 — 미설정 시 조용히 약한 기본값을 쓰는 대신 명시적으로 실패한다.
      # 폴백값이 공개 저장소에 커밋돼 실운영 크리덴셜이 됐던 것이 B21 이다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 설정할 것 (B21)}
    ports:
      # 루프백 전용 — 백엔드는 도커 네트워크 별칭 postgres:5432 로 접속하므로
      # 호스트 발행은 사람이 psql 로 붙을 때만 쓰인다. 0.0.0.0 이면 LAN 전체에 열린다.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/auth_schema.sql:/docker-entrypoint-initdb.d/01-auth.sql
      - ../backend/app_schema.sql:/docker-entrypoint-initdb.d/02-app.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolion"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
